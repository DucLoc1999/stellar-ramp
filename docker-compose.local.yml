version: '3.8'

# Local stack: payment API + stellar listener + stellar signer worker.
# Usage: docker compose -f docker-compose.yaml.local up --build
#
# All services read .env.local. The signer's secrets (STELLAR_PRIVATE_KEY,
# INTERNAL_AUTH_TOKEN) come from stellar_signer_worker/.env mounted as .dev.vars
# (the file `wrangler dev` reads for local bindings).

services:
  # ==========================================
  # Service 1: Main Payment API
  # ==========================================
  payment-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: payment-api-local
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    env_file:
      - .env.local
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
      # Reach the signer by service name inside the compose network, not localhost.
      WORKER_URL: http://stellar-signer:8787
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - payment-network
    depends_on:
      - stellar-listener
      - stellar-signer

  # ==========================================
  # Service 2: Stellar Blockchain Listener
  # ==========================================
  stellar-listener:
    build:
      context: .
      dockerfile: Dockerfile.listener
      target: production
    container_name: stellar-listener-local
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - payment-network

  # ==========================================
  # Service 3: Stellar Signer Worker (wrangler dev)
  # ==========================================
  stellar-signer:
    build:
      context: .
      dockerfile: Dockerfile.signer
    container_name: stellar-signer-local
    restart: unless-stopped
    ports:
      - '8787:8787'
    volumes:
      # wrangler dev reads local secret bindings from .dev.vars
      - ./stellar_signer_worker/.env:/app/.dev.vars:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:8787/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - payment-network

networks:
  payment-network:
    driver: bridge
